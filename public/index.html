<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Dial Room</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Courier+Prime:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="board">
    <span class="mark">The Dial Room</span>
    <span class="clock" id="clock">0:00</span>
    <span class="notch" id="notchBox" hidden>Resist <b id="notch">3</b></span>
    <nav class="ladder" id="ladder" aria-label="Call stage"></nav>
  </header>

  <main>
    <section class="stage" id="stage"></section>
    <aside id="rail"></aside>
  </main>

  <footer class="bar" id="bar" hidden>
    <div class="state">
      <span class="orb off" id="orb"></span>
      <span class="stateTxt" id="stateTxt">Off hook</span>
      <span class="hint" id="hint"></span>
    </div>
    <div class="fallback" id="fallback" hidden>
      <input id="say" placeholder="Type your line, Enter to send · Esc for shortcut keys" autocomplete="off" spellcheck="false">
      <button class="send" id="sendBtn" type="button">Send</button>
    </div>
    <div class="keys" id="keys"></div>
  </footer>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
